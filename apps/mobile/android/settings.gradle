import groovy.json.JsonSlurper

pluginManagement {
  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

// Explicitly set projectRoot to apps/mobile/ so autolinking uses the correct package.json
// in the pnpm monorepo (without this, traversal can land on the monorepo root package.json)
expoAutolinking.projectRoot = rootDir.parentFile

// Force-delete any stale autolinking cache that contains Windows paths
def staleAutolinkFile = new File("${rootDir}/build/generated/autolinking/autolinking.json")
if (staleAutolinkFile.exists()) {
  def staleContent = staleAutolinkFile.text
  if (staleContent.contains(':\\\\') || staleContent.contains('C:\\') || staleContent.contains('D:\\')) {
    println "=== AUTOLINKING: deleting stale Windows-path cache ==="
    staleAutolinkFile.delete()
    new File("${rootDir}/build/generated/autolinking/package.json.sha").delete()
  }
}

println "=== DEBUG rnConfigCommand: ${expoAutolinking.rnConfigCommand} ==="
println "=== DEBUG projectRoot: ${expoAutolinking.projectRoot} ==="
println "=== DEBUG rootDir: ${rootDir} ==="
println "=== DEBUG node PATH: ${['node', '--version'].execute().text.trim()} ==="

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
}

// Debug: expose autolinking result
def autolinkFile = new File("${rootDir}/build/generated/autolinking/autolinking.json")
println "=== AUTOLINKING DEBUG: file exists=${autolinkFile.exists()} path=${autolinkFile.absolutePath} ==="
if (autolinkFile.exists()) {
  def content = autolinkFile.text
  println "=== AUTOLINKING JSON (first 5000 chars) ==="
  println content.take(5000)
  println "=== END AUTOLINKING JSON ==="

  // Debug: check if project dirs exist
  def json = new JsonSlurper().parseText(content)
  json.dependencies?.each { name, dep ->
    def srcDir = dep?.platforms?.android?.sourceDir
    if (srcDir) {
      def exists = new File(srcDir).exists()
      def hasGradle = new File(srcDir, "build.gradle").exists()
      println "=== DEP: ${name} sourceDir=${srcDir} dirExists=${exists} hasBuildGradle=${hasGradle} ==="
    }
  }
}

expoAutolinking.useExpoModules()

rootProject.name = 'Trakt'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
