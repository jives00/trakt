services:
  api:
    image: ghcr.io/jives00/trakt-api:latest
    container_name: trakt-api
    ports:
      - "3002:3002"
    networks:
      - shared-db
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      TMDB_API_KEY: ${TMDB_API_KEY}
      TVDB_API_KEY: ${TVDB_API_KEY}
      OMDB_API_KEY: ${OMDB_API_KEY}
      FANART_API_KEY: ${FANART_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SCROBBLE_API_KEY: ${SCROBBLE_API_KEY}
      TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID}
      TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET}
    restart: unless-stopped

  web:
    image: ghcr.io/jives00/trakt-web:latest
    container_name: trakt-web
    ports:
      - "3001:3000"
    networks:
      - shared-db
    environment:
      API_URL: http://trakt-api:3002
    restart: unless-stopped

networks:
  shared-db:
    external: true
