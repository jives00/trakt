name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            cd ~/trakt

            # Load and use Node 24 via nvm
            export NVM_DIR=~/.nvm
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm install 24
            nvm use 24

            # Install pnpm globally
            npm install -g pnpm

            # Pull latest code (sparse checkout excludes apps/mobile — not needed on EC2)
            git sparse-checkout init --cone 2>/dev/null || true
            git sparse-checkout set apps/api apps/web packages docs
            git pull origin main

            # Load env vars (assumes .env exists in project root)
            set -a; source .env; set +a

            # Rebuild and restart containers
            # Docker container will handle migrations on startup
            docker compose up --build -d

            echo "Deployed at $(date)"
