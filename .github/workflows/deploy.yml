name: Build and Push Docker Images

on:
  push:
    branches: [main]
    tags: ['apk-*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/jives00/trakt-api:latest

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/jives00/trakt-web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=http://${{ secrets.TAILSCALE_HOSTNAME }}:3002

  build-apk:
    name: Build Android APK (Gradle)
    if: startsWith(github.ref, 'refs/tags/apk-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - name: Prebuild Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean
      - name: Build APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: http://100.115.171.80:3002
        run: ./gradlew app:assembleRelease -x lint -x test -PreactNativeArchitectures=arm64-v8a
      - name: Rename APK
        id: apk
        run: |
          TIMESTAMP=$(date -u +'%m%d%Y-%H%M')
          APK_NAME="trakt-${TIMESTAMP}.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          echo "name=${APK_NAME}" >> "$GITHUB_OUTPUT"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
