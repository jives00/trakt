name: Deploy

on:
  push:
    branches: [main]
    tags: ['apk-*']
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Gradle)
    if: startsWith(github.ref, 'refs/tags/apk-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - run: pnpm install
      - name: Prebuild Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean
      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew app:assembleRelease -x lint -x test -PreactNativeArchitectures=arm64-v8a
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk

  deploy:
    name: Deploy to EC2
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            cd ~/trakt

            # Load and use Node 24 via nvm
            export NVM_DIR=~/.nvm
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm install 24
            nvm use 24

            # Install pnpm globally
            npm install -g pnpm

            # Pull latest code (sparse checkout excludes apps/mobile — not needed on EC2)
            git sparse-checkout init --cone 2>/dev/null || true
            git sparse-checkout set apps/api apps/web packages docs
            git pull origin main

            # Load env vars (assumes .env exists in project root)
            set -a; source .env; set +a

            # Rebuild and restart containers
            # Docker container will handle migrations on startup
            docker compose up --build -d

            echo "Deployed at $(date)"
